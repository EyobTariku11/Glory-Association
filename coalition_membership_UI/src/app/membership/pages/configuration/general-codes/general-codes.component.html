<div class="container-fluid">
  <div class="row mb-3">
    <div class="col">
      <h4>General Codes</h4>
      <small class="text-muted">
        Manage InitialName/Pad/CurrentNumber for your association. This controls member ID generation.
      </small>
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" (click)="addRow()" [disabled]="loading">
        Add
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="py-3">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="table-responsive" *ngIf="!loading">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th style="width: 220px;">Type</th>
          <th style="width: 180px;">InitialName</th>
          <th style="width: 120px;">Pad</th>
          <th style="width: 160px;">CurrentNumber</th>
          <th style="width: 220px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of codes; let i = index">
          <td>
            <select
              class="form-select"
              [(ngModel)]="row.generalCodeType"
              (change)="onTypeChange(row)"
            >
              <option *ngFor="let t of generalCodeTypes" [ngValue]="t.value">
                {{ t.label }}
              </option>
            </select>
          </td>

          <td>
            <input class="form-control" [(ngModel)]="row.initialName" placeholder="EPLFFC" />
          </td>

          <td>
            <input class="form-control" type="number" [(ngModel)]="row.pad" min="1" />
          </td>

          <td>
            <input class="form-control" type="number" [(ngModel)]="row.currentNumber" min="0" />
          </td>

          <td>
            <button class="btn btn-success me-2" (click)="save(row)" [disabled]="row.saving">
              {{ row.saving ? "Saving..." : "Save" }}
            </button>
            <button class="btn btn-outline-danger" (click)="removeRow(i)" [disabled]="row.saving">
              Remove
            </button>
          </td>
        </tr>

        <tr *ngIf="codes.length === 0">
          <td colspan="5" class="text-center text-muted py-4">
            No general codes found for your association. Click “Add” to create one.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
