<div class="association-detail-page min-h-screen">

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center items-center min-h-screen">
    <div class="text-center">
      <div class="animate-spin rounded-full h-16 w-16 border-b-2 mx-auto mb-4"
        [style.border-color]="association?.primaryColor || '#3B82F6'"></div>
      <p class="text-lg text-gray-600">Loading association details...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex justify-center items-center min-h-screen">
    <div class="text-center">
      <div class="text-red-600 text-6xl mb-4">⚠️</div>
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Oops! Something went wrong</h1>
      <p class="text-gray-600 mb-6">{{ error }}</p>
      <button (click)="goBack()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition-colors">
        Go Back to Clubs
      </button>
    </div>
  </div>

  <!-- Association Content -->
  <div *ngIf="!loading && association && !error">

    <app-hero [title]="'Welcome to ' + association.name" [logoUrl]="getLogoUrl(association.logoPath)"
      [description]="association.description || ('about.description' | transloco)"
      [backgroundImage]="getLogoUrl(association.logoPath)" [inlineLogo]="false">
    </app-hero>

    <!-- Top Advertisement Banner -->
    <app-advertisement pageType="homepage" position="Top" type="Banner" [maxCount]="2"></app-advertisement>

    <app-features [title]="'Why Choose ' + association.name"></app-features>

    <!-- Inline Advertisement -->
    <app-advertisement pageType="homepage" position="Inline" type="Inline" [maxCount]="1"></app-advertisement>

    <app-news [associationId]="association.id"></app-news>
    <app-events-carousel [associationId]="association.id"></app-events-carousel>

    <!-- Sidebar Advertisement -->
    <app-advertisement pageType="homepage" position="Sidebar" type="Sidebar" [maxCount]="2"></app-advertisement>



    <app-about [title]="'About ' + association.name" [content]="association.about || association.description || ''">
    </app-about>

    <app-association-members [associationId]="association.id"></app-association-members>

    <app-board-members></app-board-members>
    <app-our-sponsors></app-our-sponsors>
    <app-donation-highlight></app-donation-highlight>

    <!-- Bottom Advertisement Banner -->
    <app-advertisement pageType="homepage" position="Bottom" type="Banner" [maxCount]="2"></app-advertisement>

    <app-contact [contactDetails]="getContactDetails()"></app-contact>

  </div>
</div>
