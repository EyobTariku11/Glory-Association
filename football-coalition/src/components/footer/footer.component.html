<footer class="bg-black text-white py-10">
    <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6">
      <div class="text-center md:text-left">
        <h3 class="text-xl font-semibold text-yellow-400">EPLFFC </h3>
        <p class="text-sm text-gray-400">© 2014 - {{ currentYear }} {{ 'footer.allRightsReserved' | transloco }}.</p>
      </div>
  
      <div class="flex items-center gap-4 text-sm">
        <a *ngIf="coalitionAbout?.facebook" 
           [href]="coalitionAbout!.facebook" 
           target="_blank"
           class="hover:text-yellow-400 transition-colors">
          <i class="fab fa-facebook mr-1"></i>{{ 'footer.facebook' | transloco }}
        </a>
        <a *ngIf="coalitionAbout?.telegram" 
           [href]="coalitionAbout!.telegram" 
           target="_blank"
           class="hover:text-yellow-400 transition-colors">
          <i class="fab fa-telegram mr-1"></i>{{ 'footer.telegram' | transloco }}
        </a>
        <a *ngIf="coalitionAbout?.tikTok" 
           [href]="coalitionAbout!.tikTok" 
           target="_blank"
           class="hover:text-yellow-400 transition-colors">
          <i class="fab fa-tiktok mr-1"></i>{{ 'footer.tiktok' | transloco }}
        </a>
        
        <!-- Fallback links if no coalition data -->
        <a *ngIf="!coalitionAbout?.facebook && !coalitionAbout?.telegram && !coalitionAbout?.tikTok" 
           href="#" class="hover:text-yellow-400">{{ 'footer.facebook' | transloco }}</a>
        <a *ngIf="!coalitionAbout?.facebook && !coalitionAbout?.telegram && !coalitionAbout?.tikTok" 
           href="#" class="hover:text-yellow-400">{{ 'footer.telegram' | transloco }}</a>
        <a *ngIf="!coalitionAbout?.facebook && !coalitionAbout?.telegram && !coalitionAbout?.tikTok" 
           href="#" class="hover:text-yellow-400">{{ 'footer.instagram' | transloco }}</a>
      </div>
  
      <div class="text-sm">
        <button class="hover:text-yellow-400">🇪🇹 Am</button> |
        <button class="hover:text-yellow-400">🇺🇸 En</button>
      </div>
    </div>
  </footer>
