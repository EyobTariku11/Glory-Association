<VirtualHost *:443>
    ServerName eplffc.et
    ServerAlias *.eplffc.et

    # SSL Settings
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/epiffe.et.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/epiffe.et.key

    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     on
    SSLCompression          off
    SSLSessionTickets       off

    # Security Headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY

    # Enable modules if not already
    # a2enmod proxy proxy_http rewrite headers ssl

    # Proxy configs
    ProxyPreserveHost On
    ProxyRequests Off

    # API endpoint
    ProxyPass /api http://localhost:6069
    ProxyPassReverse /api http://localhost:6069

    # Payment endpoint
    ProxyPass /payment/ http://localhost:8080/
    ProxyPassReverse /payment/ http://localhost:8080/

    # ───────────────────────────────────────────────
    # Admin UI - Angular SPA handling at /admin/
    # ───────────────────────────────────────────────

    # Redirect /admin to /admin/
    RewriteEngine On
    RewriteRule ^/admin$ /admin/ [R=301,L]

    # Rewrite and proxy all /admin/* requests to Angular dev/build server
    RewriteCond %{REQUEST_URI} ^/admin
    RewriteRule ^/admin/(.*)$ http://localhost:4201/$1 [P,L]

    ProxyPassReverse /admin http://localhost:4201/

    # ───────────────────────────────────────────────
    # Main app (root SPA) - Angular with proper routing
    # ───────────────────────────────────────────────
    
    # Handle static assets first (CSS, JS, images, etc.)
    ProxyPass /assets http://localhost:4200/assets
    ProxyPassReverse /assets http://localhost:4200/assets
    
    ProxyPass /favicon.ico http://localhost:4200/favicon.ico
    ProxyPassReverse /favicon.ico http://localhost:4200/favicon.ico
    
    # Handle Angular routing - CRITICAL FIX for /jerseys and /tickets
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^/(.*)$ http://localhost:4200/ [P,L]
    
    # Main proxy for everything else
    ProxyPass / http://localhost:4200/
    ProxyPassReverse / http://localhost:4200/

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/eplffc_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/eplffc_ssl_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName eplffc.et
    ServerAlias *.eplffc.et
    Redirect permanent / https://eplffc.et/
</VirtualHost> 